<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watercolors — T.S. Batra</title>
    <meta name="description" content="Watercolors by T.S. Batra.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Watercolors — T.S. Batra">
    <meta property="og:description" content="Watercolors by T.S. Batra.">
    <meta property="og:url" content="https://tsbatra.github.io/TSB-Art/watercolors/">
    <meta property="og:image" content="https://ik.imagekit.io/Kamonline/tr:w-1200,h-630,c-at_max,f-jpg,q-80/TSB-ART/FloatingBlooms">
    <meta property="og:image:secure_url" content="https://ik.imagekit.io/Kamonline/tr:w-1200,h-630,c-at_max,f-jpg,q-80/TSB-ART/FloatingBlooms">
    <meta property="og:image:type" content="image/jpeg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 600;
        }

        .artist {
            margin: 0;
            color: #666;
            font-size: 15px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            align-items: start;
        }

        .card {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .thumb-wrap {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        .thumb {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .title {
            margin-top: 9px;
            font-size: 14px;
            line-height: 1.35;
            text-align: center;
            color: #333;
        }

        /* Gallery-owned overlay. Individual artwork HTML remains clean. */
        .viewer {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            background: #f5f5f5;
        }

        .viewer.open {
            display: flex;
            flex-direction: column;
        }

        .viewer-bar {
            height: 52px;
            flex: 0 0 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-bottom: 1px solid #e1e1e1;
            background: rgba(245,245,245,0.98);
        }

        .viewer-btn {
            width: 40px;
            height: 40px;
            border: 0;
            background: transparent;
            color: #888;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            line-height: 1;
            cursor: pointer;
        }

        .viewer-btn:disabled {
            opacity: 0.22;
            cursor: default;
        }

        .gallery-icon {
            width: 15px;
            height: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
        }

        .gallery-icon span {
            border: 1px solid currentColor;
            border-radius: 1px;
        }

        .viewer-frame {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            border: 0;
            background: #f5f5f5;
        }

        @media (hover:hover) and (pointer:fine) {
            .card:hover .thumb-wrap {
                border-color: #999;
            }

            .viewer-btn:not(:disabled):hover {
                color: #222;
                background: rgba(0,0,0,0.04);
            }
        }

        @media (max-width: 600px) {
            .page {
                padding: 24px 12px 36px;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .thumb-wrap {
                padding: 6px;
            }

            .title {
                font-size: 12px;
            }

            .viewer-bar {
                height: 48px;
                flex-basis: 48px;
            }

            .viewer-btn {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Watercolors</h1>
            <p class="artist">T.S. Batra</p>
        </header>

        <div class="gallery">
            
        <a class="card" href="floating-blooms.html"
           data-art-index="0">
            <div class="thumb-wrap">
                <img class="thumb"
                     src="https://ik.imagekit.io/Kamonline/tr:w-500,h-375,c-at_max,f-jpg,q-78/TSB-ART/FloatingBlooms"
                     alt="Floating Blooms">
            </div>
            <div class="title">Floating Blooms</div>
        </a>


        <a class="card" href="SometimeWhat'sInsideShowsOnTheFace.html"
           data-art-index="1">
            <div class="thumb-wrap">
                <img class="thumb"
                     src="https://ik.imagekit.io/Kamonline/tr:w-500,h-375,c-at_max,f-jpg,q-78/TSB-ART/SometimeWhat'sInsideShowsOnTheFace"
                     alt="Sometime What's Inside Shows on the Face">
            </div>
            <div class="title">Sometime What's Inside Shows on the Face</div>
        </a>


        <a class="card" href="A-Gathering-Within.html"
           data-art-index="2">
            <div class="thumb-wrap">
                <img class="thumb"
                     src="https://ik.imagekit.io/Kamonline/tr:w-500,h-375,c-at_max,f-jpg,q-78/TSB-ART/AGatheringWithin"
                     alt="A Gathering within">
            </div>
            <div class="title">A Gathering within</div>
        </a>


        <a class="card" href="Emergence-StandingOutOfReflections.html"
           data-art-index="3">
            <div class="thumb-wrap">
                <img class="thumb"
                     src="https://ik.imagekit.io/Kamonline/tr:w-500,h-375,c-at_max,f-jpg,q-78/TSB-ART/Emergence-StandingOutOfReflections"
                     alt="Emergence-Standing out of reflections">
            </div>
            <div class="title">Emergence-Standing out of reflections</div>
        </a>


        <a class="card" href="calmness.html"
           data-art-index="4">
            <div class="thumb-wrap">
                <img class="thumb"
                     src="https://ik.imagekit.io/Kamonline/tr:w-500,h-375,c-at_max,f-jpg,q-78/TSB-ART/Calmness"
                     alt="Calmness">
            </div>
            <div class="title">Calmness</div>
        </a>

        </div>
    </div>

    <div id="viewer" class="viewer" aria-hidden="true">
        <div class="viewer-bar">
            <button id="prevBtn" class="viewer-btn" type="button"
                    aria-label="Previous artwork" title="Previous artwork">‹</button>

            <button id="galleryBtn" class="viewer-btn" type="button"
                    aria-label="Back to gallery" title="Back to gallery">
                <span class="gallery-icon" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </span>
            </button>

            <button id="nextBtn" class="viewer-btn" type="button"
                    aria-label="Next artwork" title="Next artwork">›</button>
        </div>

        <iframe id="viewerFrame" class="viewer-frame"
                title="Artwork viewer"></iframe>
    </div>

    <script>
        const artworks = [
        { title: 'Floating Blooms', file: 'floating-blooms.html' },
        { title: "Sometime What's Inside Shows on the Face", file: "SometimeWhat'sInsideShowsOnTheFace.html" },
        { title: 'A Gathering within', file: 'A-Gathering-Within.html' },
        { title: 'Emergence-Standing out of reflections', file: 'Emergence-StandingOutOfReflections.html' },
        { title: 'Calmness', file: 'calmness.html' }
        ];

        const viewer = document.getElementById("viewer");
        const frame = document.getElementById("viewerFrame");
        const prevBtn = document.getElementById("prevBtn");
        const galleryBtn = document.getElementById("galleryBtn");
        const nextBtn = document.getElementById("nextBtn");
        const cards = document.querySelectorAll("[data-art-index]");

        let currentIndex = -1;

        function showArtwork(index) {
            if (index < 0 || index >= artworks.length) return;

            currentIndex = index;
            frame.src = artworks[index].file;
            frame.title = artworks[index].title;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === artworks.length - 1;

            viewer.classList.add("open");
            viewer.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }

        function closeViewer() {
            viewer.classList.remove("open");
            viewer.setAttribute("aria-hidden", "true");
            frame.src = "";
            document.body.style.overflow = "";
            currentIndex = -1;
        }

        cards.forEach(card => {
            card.addEventListener("click", event => {
                event.preventDefault();
                showArtwork(Number(card.dataset.artIndex));
            });
        });

        prevBtn.addEventListener("click", () => showArtwork(currentIndex - 1));
        nextBtn.addEventListener("click", () => showArtwork(currentIndex + 1));
        galleryBtn.addEventListener("click", closeViewer);

        document.addEventListener("keydown", event => {
            if (!viewer.classList.contains("open")) return;

            if (event.key === "Escape") closeViewer();
            if (event.key === "ArrowLeft" && currentIndex > 0) showArtwork(currentIndex - 1);
            if (event.key === "ArrowRight" && currentIndex < artworks.length - 1) showArtwork(currentIndex + 1);
        });
    </script>
</body>
</html>
